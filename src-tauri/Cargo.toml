[package]
name = "editor"
version = "0.1.0"
description = "editor"
authors = ["mrdkprj"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "~2.6.0", features = [] }

[dependencies]
tauri = { version = "~2.11.0", features = [ "devtools", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
smol = "2.0.2"
notify-debouncer-full = "0.6.0"
grep = "0.4.1"
wcpopup = { version = "0.9.6", features = ["webview"] }
zouni = { version = "0.2.3", features = ["webview2"] }
globset = "0.4.18"
chardetng = "0.1.17"
encoding_rs = "0.8.35"
tauri-plugin-single-instance = "=2.3.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18.2" }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
#tauri-runtime-wry = {path = "./tauri-runtime-wry-2.11.4"}

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size
strip = true # Remove debug symbols
